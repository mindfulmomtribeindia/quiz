<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Your Mindful Home Type?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#EFEAFB;
    --card:#FFFFFF;
    --ink:#2A2340;
    --ink-soft:#6E6785;
    --sage:#7C4FE0;
    --sage-dark:#6535C9;
    --rose:#B073E8;
    --line:#DDD3F5;
    --accent:#7C4FE0;
    --accent-soft:#EFE6FC;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--ivory);
    color:var(--ink);
    background-image:
      radial-gradient(circle at 8% 12%, #E4D9FA 0%, transparent 40%),
      radial-gradient(circle at 92% 88%, #E6DCFA 0%, transparent 45%);
    overflow-x:hidden;
  }
  img{ max-width:100%; height:auto; }
  button{ font-family:inherit; }
  .header{
    border-bottom:1px solid var(--line);
    padding:18px 24px;
    display:flex;
    justify-content:center;
    position:sticky;
    top:0;
    background:var(--ivory);
    z-index:10;
  }
  .header-inner{
    width:100%;
    max-width:640px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo-mark{ width:28px;height:28px;flex-shrink:0; }
  .brand-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
  main{ display:flex; justify-content:center; padding:56px 20px 80px; }
  .stage{ width:100%; max-width:640px; }
  h1,h2{ font-family:'Fraunces',serif; font-weight:500; margin:0; }

  @keyframes riseIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .animate{ animation:riseIn 0.4s ease both; }

  /* ---------- Landing ---------- */
  .badge-row{ display:flex; gap:10px; margin-bottom:22px; }
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line);
    border-radius:100px; padding:6px 14px; font-size:12.5px; font-weight:600; color:var(--sage-dark);
  }
  .badge-dot{ width:6px;height:6px;border-radius:50%; background:var(--rose); }
  .landing{ text-align:center; }
  .landing h1{ font-size:40px; line-height:1.18; margin:0 auto 22px; max-width:520px; }
  .landing h1 em{ font-style:italic; color:var(--sage-dark); }
  .landing p.lead{ font-size:17px; line-height:1.7; color:var(--ink-soft); max-width:480px; margin:0 auto 26px; }
  .type-preview{ display:flex; gap:10px; margin-bottom:30px; flex-wrap:wrap; }
  .type-chip{
    font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:100px;
    border:1px solid var(--line); background:var(--card);
  }
  .stat-line{ font-size:15px; color:var(--ink); font-weight:500; margin:0 0 28px; }
  .start-btn{
    padding:16px 34px; border-radius:12px; border:none;
    background:var(--sage); color:#fff; font-family:'Inter',sans-serif;
    font-size:16px; font-weight:600; cursor:pointer; transition:transform 0.15s ease, background 0.2s ease;
    box-shadow:0 4px 14px rgba(84,96,74,0.25);
  }
  .start-btn:hover{ background:var(--sage-dark); transform:translateY(-1px); }
  .trust-line{ font-size:14px; color:var(--ink-soft); margin-top:22px; }

  /* ---------- Quiz ---------- */
  .progress-wrap{ margin-bottom:22px; }
  .progress-text{ font-size:14px; color:var(--ink-soft); font-weight:500; margin:0 0 8px; }
  .dots{ display:flex; gap:5px; }
  .dot{ height:5px; flex:1; border-radius:4px; background:var(--line); transition:background 0.3s ease; }
  .dot.filled{ background:var(--sage); }
  .progress-track{ height:6px; background:var(--line); border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--sage); border-radius:6px; transition:width 0.4s ease; }

  .mom-illustration{ width:100%; max-width:360px; height:auto; margin:0 auto 22px; display:block; border-radius:16px; box-shadow:0 8px 24px rgba(124,79,224,0.14); }

  .heart-divider{ display:flex; align-items:center; justify-content:center; gap:14px; margin:18px auto 20px; max-width:340px; }
  .heart-divider span{ flex:1; height:1px; background:var(--line); }

  .thought-row{ display:flex; justify-content:center; align-items:flex-end; gap:10px; margin:8px auto 22px; flex-wrap:wrap; }
  .thought-bubble{
    position:relative;
    background:var(--card);
    border:1.4px solid var(--line);
    border-radius:100px;
    padding:16px 18px;
    font-family:'Fraunces',serif;
    font-size:14px;
    line-height:1.35;
    color:var(--ink);
    text-align:center;
    box-shadow:0 3px 10px rgba(124,79,224,0.06);
    min-width:110px;
  }
  .thought-bubble em{ color:var(--sage); font-style:normal; font-weight:600; }
  .tb-2{ margin-bottom:-14px; }
  .tb-tail{ position:absolute; border-radius:50%; background:var(--card); border:1.4px solid var(--line); }
  .tb-tail.t1{ width:12px; height:12px; left:20px; bottom:-16px; }
  .tb-tail.t2{ width:7px; height:7px; left:12px; bottom:-26px; }

  .fun-fact{ font-size:14.5px; line-height:1.7; color:var(--ink-soft); max-width:440px; margin:0 auto 26px; }
  .fun-fact strong{ color:var(--sage-dark); }

  .info-card{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 20px; max-width:400px; margin:0 auto 26px;
  }
  .info-card-title{ font-size:15px; font-weight:600; margin:0 0 2px; color:var(--ink); }
  .info-card-sub{ font-size:13.5px; color:var(--ink-soft); margin:0; }

  .break-card{ text-align:center; padding:44px 32px; }
  .break-icon{ margin:8px auto 18px; }
  .break-icon img{ margin:0 auto; }
  .break-note{ font-size:18px; line-height:1.6; color:var(--ink); max-width:400px; margin:0 auto 30px; font-family:'Fraunces',serif; }
  .break-card .start-btn{ display:inline-block; padding:14px 30px; }
  .instruction{ font-size:14.5px; line-height:1.6; color:var(--ink-soft); font-style:italic; margin:0 0 26px; max-width:520px; }
  .instruction strong{ font-style:normal; color:var(--ink); }
  .card h2.question{ font-size:24px; line-height:1.4; margin:0 0 26px; max-width:540px; }
  .options{ display:flex; flex-direction:column; gap:12px; }
  button.opt{
    text-align:left; padding:18px 20px; border-radius:12px;
    border:1px solid var(--line); background:var(--card);
    font-family:'Inter',sans-serif; font-size:15.5px; line-height:1.5; color:var(--ink);
    cursor:pointer; transition:all 0.15s ease; position:relative;
  }
  button.opt:hover{ border-color:var(--sage); background:var(--accent-soft); transform:translateX(3px); }
  button.opt.chosen{ border-color:var(--sage); background:var(--accent-soft); }

  /* ---------- Email gate ---------- */
  .gate{ text-align:left; }
  .gate-icon{ width:52px; height:52px; margin-bottom:20px; }
  .gate h2{ font-size:27px; margin-bottom:12px; max-width:460px; }
  .gate p{ font-size:15.5px; line-height:1.7; color:var(--ink-soft); max-width:440px; margin:0 0 26px; }
  .gate-form{ display:flex; flex-direction:column; gap:12px; max-width:400px; }
  .gate-form input{
    padding:15px 16px; border-radius:12px; border:1px solid var(--line);
    font-family:'Inter',sans-serif; font-size:15px; background:var(--card); color:var(--ink);
  }
  .gate-form input:focus{ outline:2px solid var(--sage); outline-offset:1px; }
  .gate-form button{
    padding:16px; border-radius:12px; border:none; background:var(--rose); color:#fff;
    font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; transition:background 0.2s ease;
  }
  .gate-form button:hover{ background:#B87A6B; }
  .gate-note{ font-size:13px; color:var(--ink-soft); margin-top:14px; }
  .error-msg{ font-size:13px; color:#B5544A; min-height:16px; margin:-4px 0 0; }

  /* ---------- Result ---------- */
  .result-icon{ width:64px; height:64px; margin-bottom:18px; }
  .result-label{ font-size:14px; color:var(--accent); font-weight:600; margin:0 0 8px; }
  h1.result-title{ font-size:36px; margin:0 0 26px; }
  .block{ background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:14px; padding:20px 22px; margin-bottom:14px; }
  .block-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent); margin:0 0 8px; }
  .block p{ font-size:15px; line-height:1.65; margin:0; color:var(--ink); }
  .msg{ font-size:16px; line-height:1.75; margin:20px 0 30px; color:var(--ink-soft); max-width:520px; }
  .bar-labels{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .now-goal-bar{ height:10px; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative; margin-bottom:34px; }
  .now-goal-fill{ height:100%; background:linear-gradient(90deg,#DCC9A3,var(--accent)); width:0%; transition:width 0.8s cubic-bezier(.2,.8,.2,1); }
  .goal-marker{ position:absolute; top:-2px;bottom:-2px; width:2px; background:var(--ink); }
  .cta{
    padding:16px 34px; border-radius:12px; border:none; background:var(--rose); color:#fff;
    font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; transition:background 0.2s ease;
    box-shadow:0 4px 14px rgba(201,140,125,0.3);
  }
  .cta:hover{ background:#B87A6B; }

  /* ---------- Result: center layout ---------- */
  .result-center{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .result-center .result-icon{ margin:0 auto 4px; }
  .result-center .block{ text-align:left; width:100%; max-width:480px; }
  .result-center .msg{ max-width:480px; }
  .result-center .bar-labels{ width:100%; max-width:480px; }
  .result-center .now-goal-bar{ width:100%; max-width:480px; }
  .result-center .actions-panel{ width:100%; max-width:480px; }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  .reveal{ opacity:0; animation:fadeUp 0.5s ease forwards; animation-delay:var(--d, 0s); }

  .score-badge{
    position:relative;
    width:120px; height:120px;
    display:flex; align-items:center; justify-content:center;
    margin:6px 0 26px;
  }
  .score-ring{ width:120px; height:120px; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--line); stroke-width:7; }
  .ring-fill{
    fill:none; stroke:var(--accent); stroke-width:7; stroke-linecap:round;
    stroke-dasharray:264; stroke-dashoffset:264;
    transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);
  }
  .score-badge-text{ position:absolute; display:flex; align-items:baseline; gap:2px; }
  .score-num{ font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--ink); }
  .score-max{ font-size:14px; color:var(--ink-soft); }

  .actions-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; max-width:480px;
    background:none; border:1px dashed var(--line); border-radius:12px;
    padding:14px 18px; margin:0 0 4px;
    font-family:'Inter',sans-serif; font-size:14.5px; font-weight:600; color:var(--accent);
    cursor:pointer; transition:background 0.15s ease, border-color 0.15s ease;
  }
  .actions-toggle:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .actions-toggle svg{ transition:transform 0.25s ease; flex-shrink:0; }
  .actions-panel{
    max-height:0; overflow:hidden;
    transition:max-height 0.35s ease, margin 0.35s ease;
    text-align:left;
  }
  .actions-panel.open{ max-height:400px; margin:14px 0 22px; }
  .actions-panel .actions-list{ margin:0; padding-left:18px; }
  .actions-panel .actions-list li{ font-size:14.5px; line-height:1.7; color:var(--ink); margin-bottom:8px; }
  .actions-panel .actions-list li:last-child{ margin-bottom:0; }

  .cta-row{ display:flex; justify-content:center; width:100%; max-width:480px; }
  .cta-row .cta{ width:100%; }

  /* ---------- Mobile optimization ---------- */
  @media(max-width:480px){
    .header{ padding:14px 16px; }
    main{ padding:32px 16px 56px; }
    .landing h1{ font-size:27px; line-height:1.22; }
    .landing p.lead{ font-size:15.5px; }
    .thought-bubble{ font-size:13px; padding:13px 15px; min-width:96px; }
    .info-card{ padding:14px 16px; gap:10px; }
    .card{ padding:26px 20px; }
    .card h2.question{ font-size:19px; }
    .instruction{ font-size:13.5px; }
    button.opt{ padding:15px 16px; font-size:14.5px; }
    .gate h2{ font-size:23px; }
    h1.result-title{ font-size:26px; }
    .result-center .block{ padding:16px 18px; }
    .msg{ font-size:14.5px; }
    .score-badge{ width:104px; height:104px; }
    .score-ring{ width:104px; height:104px; }
    .actions-toggle{ font-size:13.5px; padding:13px 14px; }
    .cta, .start-btn{ font-size:15px; padding:15px 24px; }
  }

  /* ---------- Desktop optimization ---------- */
  @media(min-width:1024px){
    .header-inner{ max-width:760px; }
    .stage{ max-width:760px; }
    main{ padding:72px 24px 100px; }
    .landing h1{ font-size:46px; }
    .landing p.lead{ font-size:18px; max-width:540px; }
    .card{ padding:44px 40px; }
    .card h2.question{ font-size:26px; max-width:600px; }
    .options{ gap:14px; }
    button.opt{ padding:19px 22px; font-size:16px; }
    button.opt:hover{ transform:translateX(4px); }
    .result-center .block, .result-center .msg, .result-center .bar-labels, .result-center .now-goal-bar, .result-center .actions-panel{ max-width:540px; }
    .cta-row{ max-width:340px; }
    .start-btn:hover, .cta:hover{ transform:translateY(-2px); }
  }

  /* Ensure buttons keep a comfortable touch target on all sizes */
  button.opt, .start-btn, .cta, .actions-toggle, .gate-form button{ min-height:48px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <svg class="logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="13.5" stroke="#E7E0D3"/>
      <path d="M14 20C14 20 7 16 7 10.5C7 7.46 9.46 5 12.5 5C13.1 5 14 5.8 14 6.5C14 5.8 14.9 5 15.5 5C18.54 5 21 7.46 21 10.5C21 16 14 20 14 20Z" fill="#6E7F5E"/>
    </svg>
    <span class="brand-name">Mindful Moms Tribe</span>
  </div>
</div>

<main><div class="stage" id="root"></div></main>

<script>
const QBANK = [
["When you hear about rising health issues in children today, what's your first thought?",["This is scary, I hope my child is safe","I wonder if I'm unknowingly doing something wrong","I've thought about this but don't know what to change","I'm already careful about these things"]],
["How confident are you that your home environment is truly safe for your family?",["I've never really questioned it","I assume it is","I'm not fully sure","I'm quite confident"]],
["If someone asked you to explain what makes your home safe, what would you say?",["I wouldn't know what to say","I'd talk about general cleanliness","I know some things, not everything","I have clear reasons and choices"]],
["When you buy everyday products, what do you mostly rely on?",["Whatever is easily available","Brand trust","Recommendations","My own understanding"]],
["Have you ever questioned what goes into your home daily?",["Never","Rarely","Sometimes","Often"]],
["Do you feel you have full clarity on what your family is exposed to at home?",["No clarity at all","A little clarity","Fairly clear","Completely clear"]],
["When buying products, what usually drives your decision?",["Convenience","Habit","Trying better options","Conscious evaluation"]],
["When you try to make better choices, what happens?",["I don't start","I try but stop","I stay consistent sometimes","I follow through"]],
["Have you ever gone back to old products after trying better ones?",["Always","Often","Sometimes","Rarely"]],
["Do you currently follow any system to manage what enters your home?",["No system at all","I try randomly","I have some structure","I follow a clear system"]],
["If you had to audit your home today, how would you feel?",["Lost","Confused","Manageable","Clear"]],
["Which statement feels most like you?",["I don't know what to do","I know but don't act","I try but struggle","I follow through"]],
["Do you believe everyday choices can affect long-term health?",["Never thought about it","Maybe","Yes","Strongly yes"]],
["Does not knowing what's in your home feel risky?",["Not really","A little","Yes","Definitely"]],
["Have you ever connected lifestyle choices to health issues?",["Never","Rarely","Sometimes","Often"]],
["How do you feel about your current choices as a mom?",["I haven't thought about it","I feel I could do better","I feel inconsistent","I feel confident"]],
["What holds you back the most?",["I don't know where to start","I feel overwhelmed","I lack consistency","I just need structure"]],
["If nothing changes, how do you feel?",["It's fine","Slightly concerned","Worried","Very worried"]],
["If you had a simple system to manage your home better, what would you do?",["Probably ignore it","Think about it","Try it","Follow it seriously"]],
["Right now, where do you feel you stand?",["I haven't started","I'm figuring it out","I'm trying","I'm consistent"]]
];
// Curiosity-style questions first, heavier self-assessment questions later, grouped in 4s for break screens
const ORDER = [3,4,6,5, 0,1,2,12, 7,8,9,10, 11,13,14,15, 16,17,18,19];
const questions = ORDER.map(i => QBANK[i]);

// Each break follows a specific question (Q4: clarity on exposure, Q8: everyday choices & health,
// Q12: home audit feeling, Q16: current choices as a mom), so the note responds to that theme.
const breakTips = [
  "Not knowing everything yet doesn't mean you're behind. It means you're starting to look, and that's the real shift.",
  "You clearly already sense that the small stuff matters. That instinct is worth trusting.",
  "Feeling unsure about an audit today doesn't mean you're doing badly. Most moms have never actually done one.",
  "However you answered that one, showing up here already says a lot about the mom you are."
];

const outcomes = {
  overwhelmed:{name:"Overwhelmed survivor",now:"You're doing your best day to day, but the constant noise around what's safe leaves you feeling lost and unsure where to even begin.",goal:"A home where you know exactly what's coming in and why, without the guesswork.",msg:"You're not failing, you're just missing a system. Once you have one, the overwhelm lifts fast.",pct:25,accent:"#9C7CE0",soft:"#EEE8FB",icon:"scribble",
    actions:["Pick just one category (skincare, snacks, or cleaning) to look at this week, not everything at once","Write down the 3 products you use most and check what's actually in them","Give yourself permission to go slow, one small swap beats zero swaps"]},
  aspiring:{name:"Aspiring mindful mom",now:"You're aware something needs to change and you've tried, but it hasn't stuck yet.",goal:"Consistency that doesn't depend on willpower, built into your everyday routine.",msg:"You already have the awareness, the missing piece is a repeatable structure to lean on.",pct:50,accent:"#8C5CE6",soft:"#ECE4FA",icon:"sprout",
    actions:["Set one fixed day a month as your 'home audit' day, so it's a habit, not a decision","Build a simple checklist so you don't rely on remembering everything","Track your swaps somewhere visible, progress you can see is progress you'll repeat"]},
  exhausted:{name:"Conscious but exhausted",now:"You know a lot and you're putting in real effort, but it still feels like a constant uphill climb.",goal:"The same awareness and effort, minus the exhaustion, because the system does the remembering for you.",msg:"You've done the hard part already. Now it's about working smarter, not harder.",pct:75,accent:"#6E3EC9",soft:"#E7DBF6",icon:"battery",
    actions:["Automate what you can, subscriptions or auto-reorders for products you've already vetted","Delegate one part of the process to a partner or family member","Batch decisions once a month instead of re-deciding every single purchase"]},
  thriving:{name:"Balanced and thriving",now:"You're already confident and consistent in how you manage your home.",goal:"Refining and sharing what already works, with even more ease.",msg:"You're exactly where a mindful home should be. Let's help you go even deeper.",pct:95,accent:"#4A219E",soft:"#E1D3F5",icon:"lotus",
    actions:["Document your system so it's easy to hand off or repeat without re-thinking it","Mentor another mom who's earlier in the journey than you","Revisit your choices twice a year, even good systems benefit from a refresh"]}
};

function getOutcome(score){
  if(score<=40)return outcomes.overwhelmed;
  if(score<=60)return outcomes.aspiring;
  if(score<=75)return outcomes.exhausted;

function archetypeIcon(type, size){
  return `<img src="${ICONS[type]}" width="${size}" height="${size}" style="display:block;border-radius:50%;" alt="${type} icon">`;
}

let started=false, current=0, score=0, atGate=false, email='', name='', whatsapp='', atBreak=false, breakIndex=0;
const root=document.getElementById('root');
const SUBMIT_URL = 'https://formspree.io/f/maqrzkyv';

function renderLanding(){
  root.innerHTML = `
    <div class="landing animate">
      <h1>You already care.<br>Let's find <em>your</em> rhythm.</h1>
      <div class="heart-divider"><span></span>${heartIcon()}<span></span></div>
      <p class="lead">You're the one deciding what comes into your home every single day, often without even realizing it. This quiz shows you where you stand right now, and one small step you could take next.</p>

      
      <div class="thought-row">
        <div class="thought-bubble tb-1">Am I doing<br>enough?<span class="tb-tail t1"></span><span class="tb-tail t2"></span></div>
        <div class="thought-bubble tb-2">Am I even<br><em>fit</em> to be one?<span class="tb-tail t1"></span><span class="tb-tail t2"></span></div>
        <div class="thought-bubble tb-3">Am I a<br>good mom?<span class="tb-tail t1"></span><span class="tb-tail t2"></span></div>
      </div>

      <img class="mom-illustration" src="data:image/jpeg;base64,${MOM_IMG}" alt="A mom pausing to reflect at her desk">

      <div class="info-card">
        ${clockIcon()}
        <div>
          <p class="info-card-title">Takes about 2 minutes.</p>
          <p class="info-card-sub">A small step to understand yourself better.</p>
        </div>
      </div>

      <button class="start-btn" id="start-btn">Find out &rarr;</button>
      <p class="trust-line">You'll be in good company, this is the Mindful Moms Tribe. No spam, ever.</p>
    </div>
  `;
  document.getElementById('start-btn').onclick = () => { started=true; render(); };
}

function heartIcon(){
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="#8C5CE6" xmlns="http://www.w3.org/2000/svg"><path d="M8 14C8 14 1.5 10.2 1.5 5.7C1.5 3.6 3.1 2 5.1 2C6.4 2 7.5 2.7 8 3.7C8.5 2.7 9.6 2 10.9 2C12.9 2 14.5 3.6 14.5 5.7C14.5 10.2 8 14 8 14Z"/></svg>`;
}

function clockIcon(){
  return `<svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="13" cy="13" r="10.5" stroke="#8C5CE6" stroke-width="1.6"/><path d="M13 7V13L17 15.5" stroke="#8C5CE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}


function renderGate(){
  root.innerHTML = `
    <div class="gate animate">
      ${archetypeIcon('lotus',52).replace('<img','<img class="gate-icon"')}
      <h2>You're one step away.</h2>
      <p>Tell us who you are, and we'll show you your Mindful Home type, plus what your next step forward could look like.</p>
      <div class="gate-form">
        <input type="text" id="name-input" placeholder="Your name" autocomplete="name">
        <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email">
        <input type="tel" id="whatsapp-input" placeholder="WhatsApp number" autocomplete="tel">
        <p class="error-msg" id="email-error"></p>
        <button id="reveal-btn">Reveal my result</button>
      </div>
      <p class="gate-note">Your details stay with Mindful Moms Tribe. No spam, ever.</p>
    </div>
  `;
  const nameInput = document.getElementById('name-input');
  const input = document.getElementById('email-input');
  const whatsappInput = document.getElementById('whatsapp-input');
  const err = document.getElementById('email-error');
  const btn = document.getElementById('reveal-btn');

  btn.onclick = () => {
    const nameVal = nameInput.value.trim();
    const val = input.value.trim();
    const whatsappVal = whatsappInput.value.trim();
    const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
    const validWhatsapp = /^[\d+\s-]{7,15}$/.test(whatsappVal);

    if(!nameVal){
      err.textContent = 'Enter your name to see your result.';
      nameInput.style.borderColor = '#B5544A';
      return;
    }
    if(!validEmail){
      err.textContent = 'Enter a valid email to see your result.';
      input.style.borderColor = '#B5544A';
      return;
    }
    if(!validWhatsapp){
      err.textContent = 'Enter a valid WhatsApp number to see your result.';
      whatsappInput.style.borderColor = '#B5544A';
      return;
    }

    name = nameVal;
    email = val;
    whatsapp = whatsappVal;
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Sending your result...';

    const outcome = getOutcome(score);

    fetch(SUBMIT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({ name: name, email: email, whatsapp: whatsapp, result: outcome.name })
    })
    .then(async (res) => {
      if(!res.ok){
        const body = await res.text().catch(() => '');
        console.error('Formspree submission failed:', res.status, body);
      } else {
        console.log('Formspree submission succeeded.');
      }
      atGate = false;
      renderResult();
    })
    .catch((e) => {
      console.error('Formspree network error:', e);
      // Even if the network call fails, don't block the person from seeing their result.
      atGate = false;
      renderResult();
    });
  };

  const handleEnter = (e) => { if(e.key === 'Enter') btn.click(); };
  nameInput.addEventListener('keydown', handleEnter);
  input.addEventListener('keydown', handleEnter);
  whatsappInput.addEventListener('keydown', handleEnter);
}

function renderResult(){
  const outcome=getOutcome(score);
  document.documentElement.style.setProperty('--accent', outcome.accent);
  document.documentElement.style.setProperty('--accent-soft', outcome.soft);
  const fillPct=Math.round((score/80)*100);
  const actionsHtml = outcome.actions.map(a => `<li>${a}</li>`).join('');
  root.innerHTML=`
    <div class="animate result-center">
      ${archetypeIcon(outcome.icon, 72).replace('<img','<img class="result-icon"')}
      <p class="result-label">Your Mindful Home type</p>
      <h1 class="result-title">${outcome.name}</h1>

      <div class="score-badge" id="score-badge">
        <svg viewBox="0 0 100 100" class="score-ring">
          <circle cx="50" cy="50" r="42" class="ring-track"/>
          <circle cx="50" cy="50" r="42" class="ring-fill" id="ring-fill"/>
        </svg>
        <div class="score-badge-text">
          <span class="score-num" id="score-num">0</span>
          <span class="score-max">/80</span>
        </div>
      </div>

      <div class="block reveal" style="--d:0.1s">
        <p class="block-label">Now</p>
        <p>${outcome.now}</p>
      </div>
      <div class="block reveal" style="--d:0.22s">
        <p class="block-label">Goal</p>
        <p>${outcome.goal}</p>
      </div>
      <p class="msg reveal" style="--d:0.32s">${outcome.msg}</p>

      <div class="bar-labels"><span>Now</span><span>Goal</span></div>
      <div class="now-goal-bar">
        <div class="now-goal-fill" id="fillbar"></div>
        <div class="goal-marker" style="left:${outcome.pct}%;"></div>
      </div>

      <button class="actions-toggle reveal" style="--d:0.42s" id="actions-toggle">
        <span>See your steps to get there</span>
        <svg id="toggle-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="actions-panel" id="actions-panel">
        <ul class="actions-list">${actionsHtml}</ul>
      </div>

      <div class="cta-row reveal" style="--d:0.5s">
        <button class="cta" onclick="window.location.href='https://chat.whatsapp.com/Fop3LnIeoQfBw0cJLD09rc?mode=gi_t'">Join Mindful Moms Tribe India</button>
      </div>
    </div>`;

  const toggle = document.getElementById('actions-toggle');
  const panel = document.getElementById('actions-panel');
  const chevron = document.getElementById('toggle-chevron');
  toggle.onclick = () => {
    const open = panel.classList.toggle('open');
    chevron.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
  };

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.getElementById('fillbar').style.width = fillPct + '%';
      const circumference = 2 * Math.PI * 42;
      const ringFill = document.getElementById('ring-fill');
      ringFill.style.strokeDasharray = circumference;
      ringFill.style.strokeDashoffset = circumference - (circumference * (score/80));
      // count up the score number
      const numEl = document.getElementById('score-num');
      let n = 0;
      const step = Math.max(1, Math.round(score/30));
      const timer = setInterval(() => {
        n += step;
        if(n >= score){ n = score; clearInterval(timer); }
        numEl.textContent = n;
      }, 20);
    });
  });
}

function render(){
  if(!started){ renderLanding(); return; }

  if(atBreak){ renderBreak(); return; }

  if(current<questions.length){
    const[q,opts]=questions[current];
    const pct = Math.round((current/questions.length)*100);
    root.innerHTML=`
      <div class="card animate">
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
        </div>
        <p class="instruction">Several of these might feel true for you, and that's okay. Just go with the one that feels <strong>most</strong> like you today.</p>
        <h2 class="question">${q}</h2>
        <div class="options" id="opts"></div>
      </div>`;
    const optsDiv=root.querySelector('#opts');
    opts.forEach((o,i)=>{
      const btn=document.createElement('button');
      btn.className='opt';
      btn.textContent=o;
      btn.onclick=()=>{
        score+=(i+1);
        btn.classList.add('chosen');
        [...optsDiv.children].forEach(b=>b.disabled=true);
        setTimeout(()=>{
          current++;
          if(current>=questions.length){ atGate=true; renderGate(); }
          else if(current%4===0){ atBreak=true; render(); }
          else render();
        }, 180);
      };
      optsDiv.appendChild(btn);
    });
  }else if(atGate){
    renderGate();
  }else{
    renderResult();
  }
}

function renderBreak(){
  const note = breakTips[breakIndex % breakTips.length];
  breakIndex++;
  const pct = Math.round((current/questions.length)*100);
  root.innerHTML=`
    <div class="card animate break-card">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      </div>
      <div class="break-icon">${archetypeIcon('lotus',44)}</div>
      <p class="break-note">${note}</p>
      <button class="start-btn" id="break-continue">Continue &rarr;</button>
    </div>`;
  document.getElementById('break-continue').onclick = () => { atBreak=false; render(); };
}

render();
</script>
</body>
</html>
